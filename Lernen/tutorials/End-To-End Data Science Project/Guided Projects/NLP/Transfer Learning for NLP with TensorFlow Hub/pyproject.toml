[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coursera-transfer-learning-nlp-tfhub"
version = "0.1.0"
description = "Local and Docker-ready setup for the Coursera TF Hub NLP guided project."
requires-python = ">=3.11,<3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
