services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursera-transfer-learning-nlp-tfhub
    working_dir: /workspace
    volumes:
      - .:/workspace
      - tfhub-cache:/root/.cache/tfhub_modules
      - pip-cache:/root/.cache/pip
    environment:
      PYTHONPATH: /workspace/src
      TFHUB_CACHE_DIR: /root/.cache/tfhub_modules
      JUPYTER_PORT: "8888"
      TENSORBOARD_PORT: "6006"
    ports:
      - "8888:8888"
      - "6006:6006"
    tty: true
    stdin_open: true
    shm_size: "2gb"

volumes:
  tfhub-cache:
  pip-cache:
