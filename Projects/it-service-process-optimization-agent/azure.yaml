# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: azure-it-service-process-optimizer
metadata:
  template: azure-it-service-process-optimizer@0.7.0

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"

# Terraform owns all infrastructure, including the Foundry account, project and
# model deployment. This file only adopts the Terraform-created project through
# its endpoint and deploys one prebuilt, digest-pinned Hosted Agent version.
# Never run `azd up`, `azd provision` or `azd down` against this project.
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

  process-optimizer-agent:
    host: azure.ai.agent
    # Deliberately Dockerfile-free so azd cannot build the root workflow
    # Dockerfile; only the prebuilt deploy/agent image below can be deployed.
    project: deploy/agent-service
    language: docker
    uses:
      - ai-project
    kind: hosted
    # Must be a literal: azd forwards service-level agent properties to the
    # azure.ai.agents extension without ${VAR} interpolation (only image and env
    # are expanded), and the extension validates the name before expansion.
    name: process-optimizer-agent
    description: Aggregate-only IT incident process optimization agent.
    # Linux/amd64 image built from deploy/agent/Dockerfile and pinned by digest:
    # <registry>.azurecr.io/process-optimizer-agent@sha256:<64 hex>
    image: ${HOSTED_AGENT_IMAGE}
    # Use the image above as the final remote artifact without building, pulling,
    # tagging or pushing it. Without this, azd's Docker framework falls back to a
    # pack/Oryx buildpack build because the project directory has no Dockerfile.
    docker:
      imagePassthrough: true
    # The image copies source rather than installing the project wheel, so use
    # the module entry point that is present in the agent image.
    startupCommand: python -m process_optimizer.agents.hosting
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      MODEL_DEPLOYMENT_NAME: ${MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME}
      AGGREGATE_API_BASE_URL: ${AGGREGATE_API_BASE_URL}
      AGGREGATE_API_SCOPE: ${AGGREGATE_API_SCOPE}
      ALLOW_PAID_MODEL_CALLS: ${ALLOW_PAID_MODEL_CALLS}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS}
      # Literal so the cost-bounding retry setting is visible on every version.
      MODEL_MAX_RETRIES: "0"
      # Guardrail runtime limits (v4+). The host refuses to start unless each is an
      # explicit integer within src/process_optimizer/guardrails/policy.v1.json.
      MODEL_MAX_CALLS: "8"
      MODEL_RUN_MAX_CALLS: "6"
      RUN_DEADLINE_SECONDS: "240"
      # Input + output tokens per run, failed attempts included (policy BU-03).
      MODEL_RUN_TOKEN_BUDGET: "40000"
      GUARDRAIL_SMALL_GROUP_THRESHOLD: "10"
      # SHA-256 of the evidence contract served by /aggregate/v1/evidence-contract
      # (guardrails.evidence_contract_sha256); the host refuses any other contract.
      EVIDENCE_CONTRACT_SHA256: ${EVIDENCE_CONTRACT_SHA256}
      ENABLE_AZURE_MONITOR: "true"
      # Statsbeat is the Azure Monitor SDK's own usage telemetry, sent to a Microsoft-owned
      # resource. Disabling it leaves the app's traces, logs and metrics unchanged.
      APPLICATIONINSIGHTS_STATSBEAT_DISABLED_ALL: "true"
      # Microsoft Learn (Deploy a hosted agent): disable user-site packages in Python images.
      PYTHONNOUSERSITE: "1"
      # The Foundry agent server records prompts and model responses unless this is "false".
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    # Hosted compute bills until the session sandbox is suspended. 120 s is the
    # minimum accepted by the azure.ai.agents schema (default 900 s).
    sessionConfiguration:
      idleTimeoutSeconds: 120
