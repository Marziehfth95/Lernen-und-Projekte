name: CI

# REFERENCE WORKFLOW. It assumes this project is the repository root. In the portfolio
# monorepo it is inactive; copy it to .github/workflows/ci.yml of a standalone repository
# to use it. See docs/ci.md.
#
# Offline only: lint, model-free evaluation, the full offline test suite and the local
# end-to-end demo on SQLite and PostgreSQL. It uses a synthetic aggregate package
# generated in the run and disposable databases. No secrets, no Azure, no model call.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOW_PAID_MODEL_CALLS: "false"
  OTEL_SDK_DISABLED: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONNOUSERSITE: "1"
  FIXTURE: tests/data/synthetic_ci_aggregate_fixture.json

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes -r deploy/pip-bootstrap.lock
          python -m pip install --require-hashes -r ci/build-requirements.lock
          python -m pip install --require-hashes -r ci/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Ruff
        run: >-
          ruff check src tests scripts/local_e2e_demo.py
          scripts/generate_synthetic_aggregate_package.py scripts/check_demo_report.py

      - name: Generate the synthetic aggregate package and compare with the reviewed values
        run: >-
          python -I scripts/generate_synthetic_aggregate_package.py
          --output-dir "$RUNNER_TEMP/synthetic-aggregates" --check "$FIXTURE"

      - name: Model-free validator suite and mocked agent evaluation
        run: |
          for suite in validator agent; do
            process-optimizer-evaluate --analysis-dir "$RUNNER_TEMP/synthetic-aggregates" \
              --suite "$suite" --mode mocked_llm > "$RUNNER_TEMP/eval-$suite.json"
          done
          python - "$RUNNER_TEMP" <<'PY'
          import json, sys
          for suite, label in (("validator", "DETERMINISTIC_VALIDATOR_NO_MODEL"),
                               ("agent", "DETERMINISTIC_MOCK_NOT_REAL_AI")):
              report = json.load(open(f"{sys.argv[1]}/eval-{suite}.json"))
              cases = report["case_results"]
              passed = sum(case["passed"] for case in cases)
              print(f"{suite}: {passed}/{len(cases)} ({report['execution_label']})")
              assert report["execution_label"] == label, report["execution_label"]
              assert cases and passed == len(cases), [c["case_id"] for c in cases if not c["passed"]]
          PY

      - name: Start a disposable PostgreSQL cluster for the test suite
        run: |
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/pg-tests" -U postgres --auth=trust -E UTF8 > /dev/null
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/pg-tests" -l "$RUNNER_TEMP/pg-tests.log" -w \
            -o "-p 55434 -c listen_addresses=127.0.0.1 -c unix_socket_directories=''" start

      - name: Guardrail and approval regression tests
        run: >-
          python -m pytest -q -p no:cacheprovider tests/test_guardrails.py
          tests/test_causal_grounding_matrix.py tests/test_causal_grounding_evaluation.py
          tests/test_causal_wording_regression.py tests/test_policy_compatibility.py
          tests/test_approval_policy_revalidation.py
        env:
          PROCESS_OPTIMIZER_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:55434/postgres

      - name: Full offline test suite (paid model test deselected; no skips allowed)
        run: |
          python -m pytest -q -p no:cacheprovider -m "not model" --junitxml="$RUNNER_TEMP/pytest.xml"
          python - "$RUNNER_TEMP/pytest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot().find("testsuite")
          skipped = int(suite.get("skipped", 0))
          print(f"tests={suite.get('tests')} failures={suite.get('failures')} skipped={skipped}")
          assert skipped == 0, "a skipped test means PostgreSQL or an SDK path was not exercised"
          PY
        env:
          PROCESS_OPTIMIZER_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:55434/postgres

      - name: Stop the test-suite PostgreSQL cluster
        if: always()
        run: pg_ctl -D "$RUNNER_TEMP/pg-tests" -m immediate -w stop || true

      - name: Local end-to-end demo on SQLite and PostgreSQL
        env:
          PYTHON: python
          PO_DEMO_REPORT_DIR: ${{ runner.temp }}/demo-reports
        run: |
          PIN="$(python -c 'import json,os; print(json.load(open(os.environ["FIXTURE"]))["served_evidence_sha256"])')"
          DIGEST="$(python -c 'import json,os; print(json.load(open(os.environ["FIXTURE"]))["expected_demo_result_digest"])')"
          scripts/run_local_e2e_demo.sh both \
            --analysis-dir "$RUNNER_TEMP/synthetic-aggregates" \
            --expected-evidence-sha256 "$PIN" --expected-digest "$DIGEST"

      - name: Gate the demo reports (25/25, mock label, known gap still open, reviewed digest)
        run: >-
          python -I scripts/check_demo_report.py --expected "$FIXTURE"
          "$RUNNER_TEMP/demo-reports/report-sqlite.json"
          "$RUNNER_TEMP/demo-reports/report-postgres.json"
